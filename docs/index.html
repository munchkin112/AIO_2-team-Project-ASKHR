<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ASKHR 산출물</title>
  <style>
    :root { color-scheme: light; font-family: "Segoe UI", "Noto Sans KR", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; color: #1f2937; background: #f7f7fb; }
    main { width: min(920px, calc(100% - 32px)); margin: 0 auto; padding: 64px 0; }
    h1 { margin: 0 0 12px; font-size: clamp(28px, 4vw, 42px); letter-spacing: -0.03em; }
    .intro { margin: 0 0 32px; color: #6b7280; line-height: 1.7; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 18px; }
    a.card { display: block; padding: 24px; color: inherit; text-decoration: none; background: #fff; border: 1px solid #e5e7eb; border-radius: 16px; box-shadow: 0 8px 24px rgba(17, 24, 39, .06); transition: transform .15s ease, box-shadow .15s ease; }
    a.card:hover, a.card:focus-visible { transform: translateY(-3px); box-shadow: 0 14px 32px rgba(17, 24, 39, .12); outline: none; }
    .num { display: inline-block; margin-bottom: 18px; color: #6d28d9; font-size: 13px; font-weight: 700; }
    h2 { margin: 0 0 10px; font-size: 20px; }
    .desc { margin: 0; color: #6b7280; line-height: 1.6; }
    footer { margin-top: 36px; color: #9ca3af; font-size: 13px; }
  </style>
</head>
<body>
  <main>
    <h1>ASKHR 산출물</h1>
    <p class="intro">ASKHR 프로젝트의 필수 산출물을 확인하세요. 각 카드를 선택하면 문서 전체 내용을 볼 수 있습니다.</p>
    <section class="grid" aria-label="산출물 목록">
      <a class="card" href="screen-spec.html">
        <span class="num">01</span>
        <h2>화면 설계서</h2>
        <p class="desc">화면 목록, 화면 흐름, 공통 구성과 상세 화면 설계를 확인합니다.</p>
      </a>
      <a class="card" href="database-design.html">
        <span class="num">02</span>
        <h2>데이터베이스 설계서</h2>
        <p class="desc">ERD, 테이블 명세, 관계 정책과 보안 규칙을 확인합니다.</p>
      </a>
      <a class="card" href="api-design.html">
        <span class="num">03</span>
        <h2>API 설계 문서</h2>
        <p class="desc">인증, 대화, 대시보드 API의 엔드포인트와 스키마를 확인합니다.</p>
      </a>
    </section>
    <footer>ASKHR · 필수 산출물 3종</footer>
  </main>
</body>
</html>
